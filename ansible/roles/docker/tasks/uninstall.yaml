- name: Desinstalar Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: absent
    purge: true

- name: Eliminar repositorio de Docker
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Eliminar GPG key de Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent